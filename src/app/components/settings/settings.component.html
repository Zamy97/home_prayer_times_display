<div class="page">
  <header class="head">
    <div class="headInner">
      <h1>Settings</h1>
      <p class="muted">Saved on this device · visit <code>/settings</code> anytime</p>
    </div>
  </header>

  <main class="main">
    <section class="panel panel--location">
      <h2 class="sectionTitle">
        <span class="sectionDot"></span>
        Location
      </h2>
      <div class="fields">
        <label class="field">
          <span class="label">City</span>
          <select
            class="input"
            [ngModel]="selectedCityId"
            (ngModelChange)="selectedCityId = $event; onCityChange()"
            name="city"
            title="Pick a city or choose Other to enter latitude and longitude"
          >
            <option [ngValue]="otherCityId">Other (enter coordinates below)</option>
            @for (city of cities; track city.id) {
              <option [ngValue]="city.id">{{ city.name }}</option>
            }
          </select>
        </label>

        @if (selectedCityId === otherCityId) {
          <div class="coordRow">
            <label class="field">
              <span class="label">Latitude</span>
              <input class="input" [(ngModel)]="lat" name="lat" placeholder="e.g. 43.6532" />
            </label>
            <label class="field">
              <span class="label">Longitude</span>
              <input class="input" [(ngModel)]="lng" name="lng" placeholder="e.g. -79.3832" />
            </label>
          </div>

          <div class="geoRow">
            <button class="btn secondary" type="button" [disabled]="geoStatus === 'loading'" (click)="useMyLocation()">
              {{ geoStatus === 'loading' ? 'Getting location…' : 'Use my location' }}
            </button>
            @if (geoStatus && geoStatus !== 'loading') {
              <span class="geoError">{{ geoStatus }}</span>
            }
          </div>
        }

        <label class="field">
          <span class="label">Timezone</span>
          <input class="input input--readonly" [value]="timezone" disabled />
        </label>
      </div>
    </section>

    <section class="panel panel--prayer">
      <h2 class="sectionTitle">
        <span class="sectionDot"></span>
        Prayer times
      </h2>
      <div class="fields">
        <label class="field">
          <span class="label">Calculation method</span>
          <select class="input" [(ngModel)]="method" name="method">
            <option *ngFor="let m of methodOptions" [ngValue]="m.value">{{ m.label }}</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Asr</span>
          <select class="input" [(ngModel)]="asr" name="asr">
            <option *ngFor="let a of asrOptions" [ngValue]="a.value">{{ a.label }}</option>
          </select>
        </label>
      </div>
    </section>

    <section class="panel panel--display">
      <h2 class="sectionTitle">
        <span class="sectionDot"></span>
        Display
      </h2>
      <div class="displayGrid">
        <label class="field">
          <span class="label">Screen layout</span>
          <select
            class="input"
            [(ngModel)]="screenLayout"
            name="screenLayout"
            title="Landscape: wall display. Portrait: stacked clock, prayers, sun times, and date."
          >
            <option *ngFor="let o of screenLayoutOptions" [ngValue]="o.value">{{ o.label }}</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Clock panel side</span>
          <select
            class="input"
            [(ngModel)]="panelLeft"
            name="panelLeft"
            title="Landscape only — which side shows the clock and prayer grid."
          >
            <option [ngValue]="true">Clock & date on left</option>
            <option [ngValue]="false">Clock & date on right</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Night mode</span>
          <select
            class="input"
            [(ngModel)]="nightMode"
            name="nightMode"
            title="Dark, dim display for a bedroom. Automatic uses your location's sunset and sunrise."
          >
            <option *ngFor="let n of nightModeOptions" [ngValue]="n.value">{{ n.label }}</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Day clock color</span>
          <select
            class="input"
            [(ngModel)]="dayClockColor"
            name="dayClockColor"
            title="Color of all times in the normal layout: clock, prayers, jumu'ah, sunrise/sunset."
          >
            <option *ngFor="let c of dayClockColorOptions" [ngValue]="c.value">{{ c.label }}</option>
          </select>
        </label>

        <label class="field">
          <span class="label">Night clock color</span>
          <select
            class="input"
            [(ngModel)]="nightClockColor"
            name="nightClockColor"
            title="Color of all times in the dark night layout: clock, prayers, countdown, sunrise/sunset."
          >
            <option *ngFor="let c of nightClockColorOptions" [ngValue]="c.value">{{ c.label }}</option>
          </select>
        </label>
      </div>
    </section>
  </main>

  <footer class="footer">
    <button class="btn primary" type="button" (click)="save()">Save & return home</button>
  </footer>
</div>
